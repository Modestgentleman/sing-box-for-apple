# Codemagic 配置文件 - sing-box-for-apple
# 将此文件重命名为 codemagic.yaml 并放在 sing-box-for-apple 仓库根目录

workflows:
  ios-workflow:
    name: sing-box iOS Build (SFI)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        # 跳过代码签名
        CM_SKIP_CODE_SIGNING: true
        # Bundle ID (修改为你自己的)
        BUNDLE_ID: "com.sagernet.singbox.ios"
        # 项目名称
        XCODE_PROJECT: "sing-box.xcodeproj"
        # Scheme 名称
        XCODE_SCHEME: "SFI"
    
    scripts:
      # 1. 安装 Go (编译 sing-box 核心需要)
      - name: Install Go
        script: |
          echo "=== Installing Go ==="
          brew install go
          go version
          
          # 设置 Go 环境变量
          export GOPATH=$HOME/go
          export PATH=$PATH:$GOPATH/bin
          
          # 安装 gomobile (用于编译移动端库)
          echo "=== Installing gomobile ==="
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      
      # 2. 初始化子模块
      - name: Initialize submodules
        script: |
          echo "=== Initializing submodules ==="
          git submodule update --init --recursive
      
      # 3. 编译 sing-box 核心 (iOS 框架)
      - name: Build sing-box core for iOS
        script: |
          echo "=== Building sing-box core for iOS ==="
          
          # 克隆 sing-box 核心（如果不存在）
          if [ ! -d "Frameworks/sing-box" ]; then
            echo "Cloning sing-box repository..."
            mkdir -p Frameworks
            cd Frameworks
            
            # 克隆仓库（不指定分支）
            git clone https://github.com/SagerNet/sing-box.git
            cd sing-box
            
            # 获取所有远程分支
            echo "Fetching all branches..."
            git fetch --all
            
            # 查看可用分支
            echo "Available branches:"
            git branch -r
            
            # 按优先级尝试分支: main -> dev-next -> main-next -> stable
            echo "Attempting to checkout suitable branch..."
            
            # 尝试 main 分支（最稳定）
            if git checkout main 2>/dev/null; then
              echo "✅ Using main branch"
            # 尝试 dev-next 分支
            elif git checkout dev-next 2>/dev/null || git checkout -b dev-next origin/dev-next 2>/dev/null; then
              echo "✅ Using dev-next branch"
            # 尝试 main-next 分支
            elif git checkout main-next 2>/dev/null || git checkout -b main-next origin/main-next 2>/dev/null; then
              echo "✅ Using main-next branch"
            # 尝试 stable 分支
            elif git checkout stable 2>/dev/null || git checkout -b stable origin/stable 2>/dev/null; then
              echo "✅ Using stable branch"
            else
              echo "⚠️ No suitable branch found, using default branch"
              git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@'
              DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
              git checkout "$DEFAULT_BRANCH" 2>/dev/null || echo "Using current branch"
            fi
            
            cd ../..
          else
            echo "sing-box directory already exists, updating..."
            cd Frameworks/sing-box
            git fetch --all
            git pull
            cd ../..
          fi
          
          # 进入 sing-box 目录
          cd Frameworks/sing-box
          
          # 显示当前分支和版本
          echo "Current branch:"
          git branch
          echo "Current commit:"
          git log -1 --oneline
          
          # 下载依赖
          echo "Downloading Go dependencies..."
          go mod download
          
          # 检查 Makefile
          if [ ! -f "Makefile" ]; then
            echo "❌ Makefile not found!"
            ls -la
            exit 1
          fi
          
          # 查看可用的 make targets
          echo "=== Available make targets ==="
          make help 2>/dev/null || make -n 2>/dev/null || cat Makefile | grep "^[a-zA-Z]" || echo "Could not determine targets"
          
          # 尝试多个可能的 target 名称
          echo "=== Building iOS framework ==="
          
          if make lib_ios 2>/dev/null; then
            echo "✅ Built with: make lib_ios"
          elif make libbox_ios 2>/dev/null; then
            echo "✅ Built with: make libbox_ios"
          elif make ios 2>/dev/null; then
            echo "✅ Built with: make ios"
          elif make lib 2>/dev/null; then
            echo "✅ Built with: make lib"
          else
            echo "❌ None of the known targets work"
            echo "=== Trying to build manually ==="
            
            # 尝试手动构建
            if [ -f "build.sh" ]; then
              bash build.sh ios || echo "build.sh failed"
            elif command -v gomobile &> /dev/null; then
              echo "Attempting gomobile build..."
              gomobile bind -target=ios -o build/libbox.xcframework ./... 2>&1 || echo "gomobile build failed"
            else
              echo "❌ No build method available"
              exit 1
            fi
          fi
          
          # 验证编译产物（检查多个可能的位置）
          echo "=== Checking build output ==="
          echo "Searching for xcframework..."
          find . -name "*.xcframework" -type d 2>/dev/null || echo "No xcframework found yet"
          
          # 可能的路径
          POSSIBLE_PATHS=(
            "build/frameworks/Libbox.xcframework"
            "build/libbox.xcframework"
            "build/Libbox.xcframework"
            "libbox.xcframework"
            "Libbox.xcframework"
          )
          
          FRAMEWORK_FOUND=false
          for path in "${POSSIBLE_PATHS[@]}"; do
            if [ -d "$path" ]; then
              echo "✅ iOS framework found at: $path"
              ls -lh "$path"
              FRAMEWORK_FOUND=true
              break
            fi
          done
          
          if [ "$FRAMEWORK_FOUND" = false ]; then
            echo "❌ iOS framework not found in expected locations"
            echo "=== Directory structure ==="
            ls -R . | head -100
            exit 1
          fi
          
          cd ../..
      
      # 4. 安装 CocoaPods 依赖（如果有 Podfile）
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "Podfile" ]; then
            echo "=== Installing CocoaPods dependencies ==="
            pod install --repo-update
          else
            echo "No Podfile found, skipping CocoaPods"
          fi
      
      # 5. 修改 Bundle ID（避免签名冲突）
      - name: Update Bundle Identifier
        script: |
          echo "=== Updating Bundle Identifier ==="
          
          # 查找并修改 Info.plist 或 project.pbxproj
          find . -name "Info.plist" -type f -exec \
            plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" {} \;
          
          echo "Bundle ID updated to: $BUNDLE_ID"
      
      # 6. 构建 iOS 应用（不签名）
      - name: Build iOS app without code signing
        script: |
          echo "=== Building iOS app (SFI scheme) ==="
          
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1
          
          echo "✅ Build completed successfully"
      
      # 7. 创建未签名的 IPA
      - name: Create unsigned IPA
        script: |
          echo "=== Creating unsigned IPA ==="
          
          # 查找编译产物
          APP_PATH=$(find build -name "*.app" -type d | grep -i "iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ App not found, searching in derived data..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SFI.app" | head -n 1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            
            # 创建 Payload 目录
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            
            # 打包成 IPA
            zip -r sing-box-ios-unsigned.ipa Payload
            rm -rf Payload
            
            echo "✅ IPA created successfully"
            ls -lh sing-box-ios-unsigned.ipa
          else
            echo "❌ Could not find built app"
            exit 1
          fi
    
    artifacts:
      - sing-box-ios-unsigned.ipa
      - build/**/*.app
    
    publishing:
      email:
        recipients:
          - 895212730@qq.com
        notify:
          success: true
          failure: true

  macos-workflow:
    name: sing-box macOS Build (SFM)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        CM_SKIP_CODE_SIGNING: true
        BUNDLE_ID: "com.sagernet.singbox.macos"
        XCODE_PROJECT: "sing-box.xcodeproj"
        XCODE_SCHEME: "SFM"
    
    scripts:
      # 安装 Go
      - name: Install Go
        script: |
          brew install go
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      
      # 初始化子模块
      - name: Initialize submodules
        script: |
          git submodule update --init --recursive
      
      # 编译 macOS 核心
      - name: Build sing-box core for macOS
        script: |
          if [ ! -d "Frameworks/sing-box" ]; then
            mkdir -p Frameworks
            cd Frameworks
            git clone https://github.com/SagerNet/sing-box.git
            cd sing-box
            git fetch --all
            # 按优先级尝试分支
            git checkout main 2>/dev/null || git checkout dev-next 2>/dev/null || git checkout stable 2>/dev/null
            cd ../..
          fi
          
          cd Frameworks/sing-box
          git pull || true
          go mod download
          
          # 尝试多个可能的 target
          make lib_macos 2>/dev/null || make libbox_macos 2>/dev/null || make macos 2>/dev/null || echo "Build may have failed"
          cd ../..
      
      # 编译 macOS 应用
      - name: Build macOS app
        script: |
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
      
      # 打包 macOS 应用
      - name: Package macOS app
        script: |
          APP_PATH=$(find build -name "*.app" -type d | grep -i "macos" | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            # 创建 DMG 或压缩包
            zip -r sing-box-macos-unsigned.zip "$APP_PATH"
            echo "✅ macOS app packaged"
          fi
    
    artifacts:
      - sing-box-macos-unsigned.zip
      - build/**/*.app

  tvos-workflow:
    name: sing-box tvOS Build (SFT)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        CM_SKIP_CODE_SIGNING: true
        BUNDLE_ID: "com.sagernet.singbox.tvos"
        XCODE_PROJECT: "sing-box.xcodeproj"
        XCODE_SCHEME: "SFT"
    
    scripts:
      - name: Install Go
        script: |
          brew install go
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      
      - name: Initialize submodules
        script: |
          git submodule update --init --recursive
      
      - name: Build sing-box core for tvOS
        script: |
          if [ ! -d "Frameworks/sing-box" ]; then
            mkdir -p Frameworks
            cd Frameworks
            git clone https://github.com/SagerNet/sing-box.git
            cd sing-box
            git fetch --all
            # 按优先级尝试分支
            git checkout main 2>/dev/null || git checkout dev-next 2>/dev/null || git checkout stable 2>/dev/null
            cd ../..
          fi
          
          cd Frameworks/sing-box
          git pull || true
          go mod download
          
          # 尝试多个可能的 target
          make lib_tvos 2>/dev/null || make libbox_tvos 2>/dev/null || make tvos 2>/dev/null || echo "Build may have failed"
          cd ../..
      
      - name: Build tvOS app
        script: |
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
      
      - name: Create unsigned IPA
        script: |
          APP_PATH=$(find build -name "*.app" -type d | grep -i "appletvos" | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r sing-box-tvos-unsigned.ipa Payload
            rm -rf Payload
          fi
    
    artifacts:
      - sing-box-tvos-unsigned.ipa
